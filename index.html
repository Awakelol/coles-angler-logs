<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cole's Angler Log</title>
<meta name="description" content="A personal fishing companion — species guide, tides, weather and catch log.">

<meta name="theme-color" content="#FFD23F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angler Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">

<script>
  // Blocking on purpose, and before the stylesheet has painted: applying the
  // theme after module load would render cream first and then snap to dark.
  (function () {
    try {
      var saved = localStorage.getItem('angler.theme');
      var choice = ['light', 'dark', 'system'].indexOf(saved) >= 0 ? saved : 'system';
      var dark = choice === 'dark' ||
        (choice === 'system' && window.matchMedia &&
         matchMedia('(prefers-color-scheme: dark)').matches);
      var resolved = dark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.style.colorScheme = resolved;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#0d1117' : '#FFD23F');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/">
      <span class="brand__mark" id="brandMark"></span>
      <span class="brand__text">
        <span class="brand__kicker">A LOG WITH A STORY</span>
        <span class="brand__name">Cole&rsquo;s Angler Log</span>
      </span>
    </a>
    <div class="topbar__actions">
      <label class="region-select">
        <span class="sr-only">Region</span>
        <select id="regionSelect"></select>
      </label>
      <a class="icon-btn" href="#/settings" aria-label="Settings">
        <!-- Gear built from primitives rather than one hand-written path: eight
             identical teeth rotated about (12,12) and a ring, so it is centred
             by construction. The previous path was drawn by hand and sat ~10%
             right of centre — the kind of thing that is obvious on screen and
             invisible in the markup. -->
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
          <g>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(45 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(90 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(135 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(180 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(225 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(270 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(315 12 12)"/>
          </g>
          <!-- evenodd punches the centre hole, so it works on any background -->
          <path fill-rule="evenodd" d="M12 5.4a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Zm0 3.9a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4Z"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<nav class="tabbar" aria-label="Primary">
  <a href="#/" data-tab="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>
    <span>Home</span>
  </a>
  <a href="#/map" data-tab="/map">

    <span>Log</span>

  <a href="#/info" data-tab="/info">

    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 11c4.4 0 8 2.5 8 5.5V21H4v-1.5C4 16.5 7.6 14 12 14Z"/></svg>
    <span>Account</span>
  </button>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  // Surface uncaught errors on <body> so they're visible in headless test runs
  // and in devtools without scrolling the console.
  const flagError = (msg) => document.body.setAttribute('data-js-error', String(msg).slice(0, 300));
  window.addEventListener('error', (e) => flagError(e.message || e.error));
  window.addEventListener('unhandledrejection', (e) => flagError(e.reason?.message || e.reason));
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>

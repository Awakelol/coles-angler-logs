<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cole's Angler Log</title>
<meta name="description" content="A personal fishing companion — species guide, tides, weather and catch log.">

<meta name="theme-color" content="#F6F4EA">
<!-- Both, deliberately. iOS reads the apple- prefixed one and always has;
     the unprefixed one is the standard, and Chrome warns about a page
     that only carries Apple's. Add to Home Screen works on iPhone from
     Safari with these plus the apple-touch-icon below. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angler Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">

<script>
  // Blocking on purpose, and before the stylesheet has painted: applying the
  // theme after module load would render cream first and then snap to dark.
  (function () {
    try {
      var saved = localStorage.getItem('angler.theme');
      var choice = ['light', 'dark', 'system'].indexOf(saved) >= 0 ? saved : 'system';
      var dark = choice === 'dark' ||
        (choice === 'system' && window.matchMedia &&
         matchMedia('(prefers-color-scheme: dark)').matches);
      var resolved = dark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.style.colorScheme = resolved;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#0d1117' : '#F6F4EA');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/">
      <span class="brand__mark" id="brandMark"></span>
      <span class="brand__text">
        <span class="brand__kicker">A LOG WITH A STORY</span>
        <span class="brand__name">Cole&rsquo;s Angler Log</span>
      </span>
    </a>
    <div class="topbar__actions">
      <label class="region-select">
        <span class="sr-only">Region</span>
        <select id="regionSelect"></select>
      </label>
      <a class="icon-btn" href="#/settings" aria-label="Settings">
        <!-- Gear built from primitives rather than one hand-written path: eight
             identical teeth rotated about (12,12) and a ring, so it is centred
             by construction. The previous path was drawn by hand and sat ~10%
             right of centre — the kind of thing that is obvious on screen and
             invisible in the markup. -->
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
          <g>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(45 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(90 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(135 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(180 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(225 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(270 12 12)"/>
            <rect x="10.7" y="1.7" width="2.6" height="4.6" rx="1.1" transform="rotate(315 12 12)"/>
          </g>
          <!-- evenodd punches the centre hole, so it works on any background -->
          <path fill-rule="evenodd" d="M12 5.4a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Zm0 3.9a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4Z"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<!-- The quick-action stack the + opens. Above the nav, so the button that
     opened it stays under your thumb while you choose. -->
<div class="quick" id="quickMenu" hidden>
  <a class="quick__item" href="#/log?new=1" data-quick>
    <span class="quick__ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 3h11l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 5v3H9v2h3v3h2v-3h3v-2h-3V8Z"/></svg>
    </span>
    <span>Log a catch</span>
  </a>
  <a class="quick__item" href="#/map?drop=1" data-quick>
    <span class="quick__ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7Zm0 4.5A2.5 2.5 0 1 0 12 11a2.5 2.5 0 0 0 0-4.5Z"/></svg>
    </span>
    <span>Drop a spot</span>
  </a>
  <a class="quick__item" href="#/info?tab=photo" data-quick>
    <span class="quick__ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3h6l1.5 2H20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.5Zm3 5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm0 2.2a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6Z"/></svg>
    </span>
    <span>Identify a photo</span>
  </a>
</div>
<div class="quick-veil" id="quickVeil" hidden></div>

<!-- ONE nav for both layouts. A phone bar and a desktop rail built as two
     elements would mean two sets of links, two active states, and a route that
     highlights in one and not the other the first time someone adds a page.
     What differs is which children show and how they flow — see the rail block
     in the stylesheet. -->
<nav class="tabbar" id="primaryNav" aria-label="Primary">
  <!-- Rail only. On a phone the brand is in the top bar. -->
  <a class="rail__head" href="#/">
    <span class="rail__mark" id="railMark"></span>
    <span class="rail__name">Cole&rsquo;s Angler Log</span>
  </a>
  <p class="rail__group">Explore</p>
  <a href="#/" data-tab="/" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>
    <span>Home</span>
  </a>
  <a href="#/map" data-tab="/map" aria-label="Map">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m9 2 6 2.2L20.4 2c.7-.2 1.6.2 1.6 1v16c0 .5-.3.9-.7 1L15 22l-6-2.2L3.6 22c-.7.2-1.6-.2-1.6-1V5c0-.5.3-.9.7-1zm0 2.3v13.4l6 2.2V6.5z"/></svg>
    <span>Map</span>
  </a>

  <!-- The middle slot on a phone, where the Log tab used to be. The log is not
       lost there — it is the first thing the + offers, and it keeps its own
       route. On the rail there is room for both, so the Log link below comes
       back and this is hoisted to the top as the primary action. The bars are
       two halves of one shape, rotated, which is what makes + BECOME x rather
       than swap for it. -->
  <button type="button" class="fab" id="quickBtn"
          aria-expanded="false" aria-controls="quickMenu" aria-label="Add">
    <span class="fab__x" aria-hidden="true"><i></i><i></i></span>
    <span class="fab__label">New entry</span>
  </button>

  <!-- Rail only: the phone bar has five slots and the + took this one. -->
  <a class="rail-only" href="#/log" data-tab="/log" aria-label="Log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h11l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 5v3H9v2h3v3h2v-3h3v-2h-3V8Z"/></svg>
    <span>Log</span>
  </a>
  <a href="#/info" data-tab="/info" aria-label="Info">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h11a3 3 0 0 1 3 3v16a1 1 0 0 1-1 1H7a3 3 0 0 1-3-3V5a3 3 0 0 1 2-2.8Zm0 15.2V19a1 1 0 0 0 1 1h11v-2H7a3 3 0 0 0-1 .2ZM12 5.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4ZM11 9.5h2V15h-2Z"/></svg>
    <span>Info</span>
  </a>
  <p class="rail__group">You</p>
  <a href="#/account" data-tab="/account" aria-label="Account">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 11c4.4 0 8 2.5 8 5.5V21H4v-1.5C4 16.5 7.6 14 12 14Z"/></svg>
    <span>Account</span>
  </a>
  <!-- Rail only: on a phone this is the gear in the top bar. -->
  <a class="rail-only" href="#/settings" data-tab="/settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Zm9 3.6a7 7 0 0 0-.1-1.1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.9-1.1L16.2 3h-4l-.4 2.8a7 7 0 0 0-1.9 1.1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.9 1.1l.4 2.8h4l.4-2.8a7 7 0 0 0 1.9-1.1l2.4 1 2-3.4-2-1.6c.06-.36.1-.73.1-1.1Z"/></svg>
    <span>Settings</span>
  </a>

  <!-- Foot of the rail. The reference hangs this off the panel's edge; the rail
       scrolls, so anything drawn outside its padding box is clipped — and down
       here it also fills the empty bottom the rail otherwise had. -->
  <button type="button" class="rail__toggle rail-only" id="railToggle"
          aria-expanded="true" aria-controls="primaryNav" aria-label="Collapse navigation">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" d="m14.5 5.5-6 6.5 6 6.5"/>
    </svg>
    <span>Collapse</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  // Surface uncaught errors on <body> so they're visible in headless test runs
  // and in devtools without scrolling the console.
  const flagError = (msg) => document.body.setAttribute('data-js-error', String(msg).slice(0, 300));
  window.addEventListener('error', (e) => flagError(e.message || e.error));
  window.addEventListener('unhandledrejection', (e) => flagError(e.reason?.message || e.reason));
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
